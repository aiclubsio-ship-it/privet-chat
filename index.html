function closeViewer() { byId("viewer-body").querySelector("video")?.pause(); byId("viewer-body").replaceChildren(); byId("viewer").hidden = true; viewerCtx = null; }

/* --- gallery (PIN checked by the Edge Function, shared through Supabase, synced with pings) --- */
const api = async (action, payload) => callApi(action, { chatId: chat.id, ...payload }, (await getParticipantSession()).access_token);
const relock = () => { gallery.token = null; gallery.exp = 0; };

async function ensureUnlocked() {
  if (gallery.token && gallery.exp > Date.now() + 15000) return true;
  if (!navigator.onLine || !chat.sb) { toast("The gallery needs a connection"); return false; }
  return showModal({
    title: "Gallery PIN", text: "Enter the 4-digit gallery PIN.",
    field: { type: "password", inputMode: "numeric", maxLength: 4, autocomplete: "off", placeholder: "PIN" },
    buttons: [
      { label: "Unlock", act: async (value) => {
        if (!/^\d{4}$/.test(value || "")) throw new Error("Enter 4 digits.");
        try { const out = await api("gallery_unlock", { pin: value }); gallery.token = out.token; gallery.exp = Date.now() + out.expiresIn * 1000; }
        catch (e) { throw new Error(e.status === 429 ? "Too many attempts. Wait a few minutes." : e.status === 403 ? "Incorrect PIN." : "Couldn't unlock. Check your connection."); }
        return true;
      } },
      { label: "Cancel", cls: "secondary", value: false }
    ]
  });
}

async function loadGallery() {
  try {
    gallery.items = (await api("gallery_list", { token: gallery.token })).items;
    renderGallery();
  } catch (e) {
    if (e.message === "Gallery locked") { relock(); closeGallery(); toast("Gallery locked. Enter the PIN again."); }
    else byId("gallery-sub").textContent = "Couldn't load. Pull to retry by reopening.";
  }
}
async function openGallery() {
  if (!(await ensureUnlocked())) return;
  gallery.open = true;
  const panel = byId("gallery");
  panel.classList.add("is-open"); panel.inert = false;
  renderGallery();
  await loadGallery();
}
function closeGallery() { gallery.open = false; const panel = byId("gallery"); panel.classList.remove("is-open"); panel.inert = true; }
function resetGalleryUi() { relock(); gallery.items = []; closeGallery(); closeViewer(); byId("gallery-body").replaceChildren(); byId("modal").hidden = true; }

function renderGallery() {
  if (!gallery.open) return;
  const body = byId("gallery-body");
  const fragment = document.createDocumentFragment();
  const tile = (item) => {
    const node = mk("button", "tile"); node.type = "button"; node.dataset.gid = item.id;
    if (safeUrl(item.url)) { const img = mk("img"); img.src = thumbUrl(item.url, item.kind, 300); img.alt = item.kind; img.loading = "lazy"; img.decoding = "async"; node.append(img); }
    if (item.kind === "video") { node.append(mk("span", "dur", item.duration ? fmtDur(item.duration) : "▶")); }
    return node;
  };
  const jobs = [...uploads.values()].filter((j) => j.scope === "gallery" && j.chatId === chat.id);
  if (jobs.length) {
    fragment.append(mk("div", "day", "Uploading"));
    const grid = mk("div", "grid");
    jobs.forEach((job) => {
      const node = mk("div", "tile");
      const src = previews.get(job.id);
      if (src) { const img = mk("img"); img.src = src; img.alt = ""; node.append(img); }
      node.append(createUpl(job));
      grid.append(node);
    });
    fragment.append(grid);
  }
  const groups = new Map();
  gallery.items.forEach((item) => { const day = new Date(item.created_at).toDateString(); (groups.get(day) || groups.set(day, []).get(day)).push(item); });
  groups.forEach((items) => {
    const label = relativeDay(items[0].created_at);
    fragment.append(mk("div", "day", label === "today" ? "Today" : label === "yesterday" ? "Yesterday" : label));
    const grid = mk("div", "grid");
    items.forEach((item) => grid.append(tile(item)));
    fragment.append(grid);
  });
  if (!groups.size && !jobs.length) fragment.append(mk("div", "empty", "No photos or videos yet. Tap + to add some."));
  body.replaceChildren(fragment);
  byId("gallery-sub").textContent = `${gallery.items.length} item${gallery.items.length === 1 ? "" : "s"} · shared`;
}

async function finishGallery(job) {
  const asset = job.asset;
  const out = await callApi("gallery_add", {
    chatId: job.chatId, token: job.galleryToken,
    item: { kind: job.kind, url: asset.secure_url, public_id: asset.public_id, bytes: asset.bytes, width: asset.width ?? job.meta.width, height: asset.height ?? job.meta.height, duration: asset.duration ?? job.meta.duration ?? null }
  }, (await getParticipantSession()).access_token).catch((e) => { if (e.message === "Gallery locked") { relock(); throw new Error("Gallery locked. Reopen it and retry."); } throw new Error("Couldn't add to the gallery. Retry."); });
  if (!gallery.items.some((i) => i.id === out.item.id)) gallery.items.unshift(out.item);
  ping("gallery"); loadEvents();
}

async function uploadToGallery(files) {
  if (!(await ensureUnlocked())) return;
  let firstError = "";
  for (const file of files) {
    try {
      const prepared = await prepareMedia(file, { maxEdge: 2400 });
      const id = crypto.randomUUID();
      previews.set(id, prepared.kind === "image" ? URL.createObjectURL(prepared.blob) : prepared.thumb || "");
      enqueue({ id, scope: "gallery", chatId: chat.id, kind: prepared.kind, blob: prepared.blob, meta: { width: prepared.width, height: prepared.height, duration: prepared.duration ?? null }, galleryToken: gallery.token, status: "queued", loaded: 0, total: prepared.blob.size, finish: finishGallery });
      renderGallery();
    } catch (error) { firstError ||= error.message; }
  }
  if (firstError) toast(firstError);
}

async function deleteGalleryItem(item) {
  if (!(await confirmModal(`Delete this ${item.kind}?`, "It is deleted for both of you and removed from storage. This can't be undone.", "Delete", true))) return;
  try {
    await api("gallery_delete", { token: gallery.token, itemId: item.id });
    gallery.items = gallery.items.filter((i) => i.id !== item.id);
    closeViewer(); renderGallery(); ping("gallery"); loadEvents();
  } catch (e) { toast(e.message === "Gallery locked" ? "Gallery locked. Reopen it." : "Couldn't delete. Try again."); }
}

const loadImage = (src) => new Promise((resolve, reject) => { const img = new Image(); const t = setTimeout(() => reject(new Error("timeout")), 12000); img.onload = () => { clearTimeout(t); resolve(); }; img.onerror = () => { clearTimeout(t); reject(new Error("load")); }; img.src = src; });

async function moveToGallery(message) {
  if (!navigator.onLine || !chat.sb) { toast("You're offline"); return; }
  const agreed = await confirmModal("Move to Gallery?", "The chat copy is removed for both of you. The file is kept in the private gallery.", "Move to Gallery");
  if (!agreed || !(await ensureUnlocked())) return;
  try {
    const { item } = await api("gallery_move", { token: gallery.token, messageId: message.id });
    // Confirm the gallery copy exists AND its file actually loads before anything is removed from the chat.
    const { items } = await api("gallery_list", { token: gallery.token });
    if (!items.some((i) => i.id === item.id)) throw new Error("not listed");
    await loadImage(thumbUrl(item.url, item.kind, 200));
    const { error } = await chat.sb.rpc("finalize_media_move", { p_message_id: message.id });
    if (error) throw error;
    chat.msgs.delete(message.client_id); idb.remove("messages", messageKey(message));
    gallery.items = items; ping("gallery"); loadEvents(); renderMessages();
    toast("Moved to Gallery");
  } catch (e) {
    if (e.message === "Gallery locked") relock();
    toast("Couldn't move it. Nothing was removed.");
  }
}

/* --- shared themes --- */
/* Dim and blur are stored inside the shared background URL (#dim=..&blur=..&pid=..) so both people get the same look. */
function bgParts(raw) {
  if (typeof raw !== "string") return { url: null, dim: 0, blur: 0, pid: null };
  const i = raw.indexOf("#"), q = new URLSearchParams(i < 0 ? "" : raw.slice(i + 1));
  const dim = Number(q.get("dim") ?? 0), blur = Number(q.get("blur") ?? 0);
  return { url: i < 0 ? raw : raw.slice(0, i), dim: Number.isFinite(dim) ? Math.min(0.9, Math.max(0, dim)) : 0,
    blur: Number.isFinite(blur) ? Math.min(20, Math.max(0, blur)) : 0, pid: q.get("pid") };
}
const packBg = (url, dim, blur, pid) => `${url}#dim=${dim}&blur=${blur}${pid ? "&pid=" + encodeURIComponent(pid) : ""}`;

const lookOf = (id) => { try { return JSON.parse(localStorage.getItem("pc.look." + id)) || {}; } catch { return {}; } };
const saveLook = (id, patch) => { try { localStorage.setItem("pc.look." + id, JSON.stringify({ ...lookOf(id), ...patch })); } catch { /* ignore */ } };

/* --- auto colors: header, message box and bubbles follow the theme or the custom background --- */
function toHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
  if (!d) return [0, 0, l];
  const sat = d / (1 - Math.abs(2 * l - 1));
  const h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [Math.round(h * 60), sat, l];
}
const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
function sampleBg(url) {      // average color of the background image (24x24 sample)
  return new Promise((resolve) => {
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const cv = document.createElement("canvas"); cv.width = cv.height = 24;
        const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, 24, 24);
        const px = cx.getImageData(0, 0, 24, 24).data; let r = 0, g = 0, b = 0, w = 0;
        for (let i = 0; i < px.length; i += 4) {
          const hi = Math.max(px[i], px[i + 1], px[i + 2]), lo = Math.min(px[i], px[i + 1], px[i + 2]), k = 0.15 + (hi - lo) / 255;
          r += px[i] * k; g += px[i + 1] * k; b += px[i + 2] * k; w += k;
        }
        resolve(toHsl([r / w, g / w, b / w]));
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = cdn(url, "f_auto,q_auto,w_48");
  });
}
function applyPalette(screen, c, theme) {
  const bg = safeUrl(activeChat.themeBg) ? bgParts(activeChat.themeBg).url : null;
  let hsl = null;
  if (bg) {
    if (c.palUrl === bg && c.pal) hsl = c.pal;
    else sampleBg(bg).then((pal) => { if (pal && activeChat && bgParts(activeChat.themeBg).url === bg) { saveLook(activeChat.id, { palUrl: bg, pal }); applyTheme(); } });
  }
  if (!hsl) hsl = toHsl(hexRgb(THEMES[theme] || THEMES.ocean));
  const [h, sat] = hsl, gray = sat < 0.12;
  const sa = gray ? 0 : Math.min(Math.max(sat, 0.5), 0.85), sg = gray ? 0 : Math.min(sat, 0.5), st = gray ? 0 : Math.min(sat, 0.35);
  const set = (k, v) => screen.style.setProperty(k, v);
  set("--accent", (bg ? `hsl(${h} ${Math.round(sa * 100)}% 48%)` : THEMES[theme] || THEMES.ocean));
  set("--glass", `hsla(${h}, ${Math.round(sg * 100)}%, 14%, .46)`);
  set("--glass-line", `hsla(${h}, ${gray ? 0 : 50}%, 78%, .22)`);
  set("--their", `hsla(${h}, ${Math.round(st * 100)}%, 20%, .8)`);
}
function applyTheme() {
  if (!activeChat) return;
  const c = lookOf(activeChat.id);
  // Server values not loaded yet: use the last known look so the chat never flashes the old theme.
  if (activeChat.themeBg === undefined && c.theme) Object.assign(activeChat, { theme: c.theme, themeBg: c.bg ?? null });
  else if (activeChat.themeBg !== undefined) saveLook(activeChat.id, { theme: activeChat.theme, bg: activeChat.themeBg ?? null });
  const theme = activeChat.theme || "ocean";
  const screen = byId("screen-chat");
  applyPalette(screen, c, theme);
  screen.style.setProperty("--mine-text", "#fff");
  let wall = byId("wall");
  if (!wall) { wall = mk("div"); wall.id = "wall"; screen.prepend(wall); }
  if (safeUrl(activeChat.themeBg)) {
    const { url: bgUrl, dim, blur } = bgParts(activeChat.themeBg);
    const url = cdn(bgUrl, "f_auto,q_auto,w_900");
    wall.style.background = `linear-gradient(rgba(0,0,0,${dim}), rgba(0,0,0,${dim})), center / cover no-repeat url("${url}")`;
    wall.style.filter = blur ? `blur(${blur}px)` : "none"; wall.style.transform = blur ? "scale(1.12)" : "none";
  } else { wall.style.background = THEME_WALL[theme] || ""; wall.style.filter = "none"; wall.style.transform = "none"; }
}
const ping = (what) => { if (chat.connected && chat.channel) chat.channel.send({ type: "broadcast", event: "sync", payload: { what, from: chat.me } }); };
function onSync(payload) {
  if (!payload || payload.from === chat.me) return;
  if (payload.what === "theme") refreshChatInfo();
  if (payload.what === "gallery") { if (gallery.open) loadGallery(); loadEvents(); }
}
async function setTheme(name, background) {
  if (!chat.sb || !navigator.onLine) throw new Error("You're offline");
  const send = (url) => chat.sb.rpc("set_chat_theme", { p_chat_id: activeChat.id, p_theme: name, p_bg_url: url, p_bg_public_id: background?.public_id ?? null });
  let { error } = await send(background?.url ?? null);
  if (error && background?.url?.includes("#") && !/rate_limited/.test(error.message)) ({ error } = await send(bgParts(background.url).url));   // server refused the extras: still apply the picture
  if (error) {
    console.error("set_chat_theme failed", error);
    const detail = [error.code, error.message].filter(Boolean).join(": ");   // real reason from the database, so it can be diagnosed
    throw new Error(/rate_limited/.test(error.message) ? "Slow down a little" : "Couldn't change the theme (" + detail + ")");
  }
  Object.assign(activeChat, { theme: name, themeBg: background?.url ?? null, themeBy: chat.me, themeAt: new Date().toISOString() });
  applyTheme(); ping("theme"); loadEvents(); renderInfo();
}

/** Preview + dim/blur sliders. `existing` = { url, pid } re-tunes the current background instead of uploading a new one. */
async function backgroundDialog({ blob, existing, dim: dim0 = 0, blur: blur0 = 0 }) {
  const local = blob ? URL.createObjectURL(blob) : cdn(existing.url, "f_auto,q_auto,w_600");
  let dim = dim0, blur = blur0;
  const preview = mk("div", "bgprev"), layer = mk("div", "bglayer");
  const paint = () => {
    layer.style.background = `linear-gradient(rgba(0,0,0,${dim}), rgba(0,0,0,${dim})), center / cover no-repeat url("${local}")`;
    layer.style.filter = blur ? `blur(${blur}px)` : "none"; layer.style.transform = blur ? "scale(1.12)" : "none";
  };
  paint();
  preview.append(layer, mk("div", "bubble theirs-sample", "Looks good?"), mk("div", "bubble mine-sample", "Yes!"));
  const tune = mk("div", "look");
  const slider = (label, min, max, step, value, fmt, set) => {
    const l = mk("label", "lrow"), v = mk("b", "", fmt(value)), i = mk("input");
    i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = value;
    i.oninput = () => { set(Number(i.value)); v.textContent = fmt(Number(i.value)); paint(); };
    l.append(mk("span", "", label), i, v); tune.append(l);
  };
  slider("Background dim", 0, 0.9, 0.05, dim, (n) => Math.round(n * 100) + "%", (n) => { dim = n; });
  slider("Background blur", 0, 20, 1, blur, (n) => n + "px", (n) => { blur = n; });
  const body = mk("div"); body.append(preview, tune);
  const id = crypto.randomUUID();
  let job = null;
  const choice = await showModal({
    title: existing ? "Dim & blur" : "Custom background", text: "Both of you will see this background.", body,
    buttons: [
      { label: "Apply for both of us", act: () => new Promise((resolve, reject) => {
        if (existing) { setTheme(activeChat.theme || "ocean", { url: packBg(existing.url, dim, blur, existing.pid), public_id: existing.pid }).then(() => resolve(true), reject); return; }
        job = { id, scope: "theme", chatId: activeChat.id, kind: "image", blob, meta: {}, status: "queued", loaded: 0, total: blob.size,
          finish: async (done) => { const asset = done.asset; await setTheme(activeChat.theme || "ocean", { url: packBg(asset.secure_url, dim, blur, asset.public_id), public_id: asset.public_id }); resolve(true); } };
        preview.append(createUpl(job));
        enqueue(job);
      }) },
      { label: "Cancel", cls: "secondary", value: false }
    ]
  });
  if (!choice && job) cancelJob(id);
  uploads.delete(id); if (blob) URL.revokeObjectURL(local);
}

async function chooseBackground(file) {
  let prepared;
  try { prepared = await prepareMedia(file, { maxEdge: 1280, onlyImage: true }); } catch (e) { toast(e.message); return; }
  const cur = bgParts(activeChat?.themeBg);
  await backgroundDialog({ blob: prepared.blob, dim: cur.url ? cur.dim : 0, blur: cur.url ? cur.blur : 0 });
}

/* --- activity (separate from messages) --- */
async function loadEvents() {
  if (!chat.sb || !chat.id) return;
  const { data } = await chat.sb.from("chat_events").select("id, actor_id, kind, detail, created_at").eq("chat_id", chat.id).order("id", { ascending: false }).limit(30);
  if (data) { chat.events = data; if (chat.infoOpen) renderInfo(); }
}
const eventText = (e) => {
  const who = nameOf(e.actor_id), what = e.detail?.kind === "video" ? "video" : "photo";
  return e.kind === "theme" ? `${who} changed the theme to ${e.detail?.theme}${e.detail?.custom_bg ? " with a custom background" : ""}`
    : e.kind === "gallery_add" ? `${who} added a ${what} to the gallery`
    : e.kind === "gallery_move" ? `${who} moved a ${what} from the chat to the gallery` : `${who} deleted a ${what} from the gallery`;
};
const stamp = (iso) => `${relativeDay(iso)} at ${clockTime(iso)}`;

function renderInfo() {
  const body = byId("info-body");
  const all = [...chat.msgs.values()].filter((m) => m.id && !m.deleted_at);
  const sent = all.filter((m) => m.sender_id === chat.me).length;
  const last = sortedMessages().filter((m) => m.id).pop();
  const card = (title, rows) => {
    const node = mk("div", "card");
    node.append(mk("h3", "", title));
    rows.forEach(([label, value]) => { const line = mk("div", "line"); line.append(mk("small", "", label), mk("b", "", value)); node.append(line); });
    return node;
  };
  const theme = mk("div", "card");
  theme.append(mk("h3", "", "Theme"));
  const swatches = mk("div", "swatches");
  PREMIUM.forEach((name) => {
    const b = mk("button", "swatch" + (activeChat?.theme === name ? " is-selected" : "")); b.type = "button"; b.dataset.i = "theme"; b.dataset.theme = name;
    b.style.background = THEME_WALL[name]; b.setAttribute("aria-label", name); b.append(mk("span", "", name));
    swatches.append(b);
  });
  theme.append(swatches);
  const bgRow = mk("div", "inline");
  const bgBtn = mk("button", "pill", "Custom background…"); bgBtn.type = "button"; bgBtn.dataset.i = "bg"; bgRow.append(bgBtn);
  if (safeUrl(activeChat?.themeBg)) {
    const adjust = mk("button", "pill", "Dim & blur"); adjust.type = "button"; adjust.dataset.i = "bg-adjust"; bgRow.append(adjust);
    const reset = mk("button", "pill", "Remove background"); reset.type = "button"; reset.dataset.i = "bg-reset"; bgRow.append(reset);
  }
  theme.append(bgRow);
  if (activeChat?.themeAt) theme.append(mk("small", "who-changed", `Changed by ${nameOf(activeChat.themeBy)} · ${stamp(activeChat.themeAt)}`));
  const activity = mk("div", "card");
  activity.append(mk("h3", "", "Activity"));
  const items = [];
  chat.events.forEach((e) => items.push([e.created_at, eventText(e)]));
  chat.plog.forEach((p) => items.push([p.at, `${chat.partner?.display_name ?? "They"} went ${p.online ? "online" : "offline"}`]));
  if (chat.created) items.push([chat.created, "Chat created"]);
  items.sort((a, b) => new Date(b[0]) - new Date(a[0])).slice(0, 30).forEach(([at, text]) => {
    const line = mk("div", "line act"); const span = mk("span"); span.append(mk("b", "", text), mk("small", "", stamp(at))); line.append(span); activity.append(line);
  });
  body.replaceChildren(
    card("People", [[activeChat?.displayName + " (you)", "You"], [chat.partner?.display_name ?? "Not joined yet", chat.partner ? statusText() : "—"]]),
    card("Chat", [["Created", chat.created ? new Date(chat.created).toLocaleDateString([], { dateStyle: "medium" }) : "—"], ["Messages", String(all.length)],
      ["Sent by you", String(sent)], ["Received", String(all.length - sent)], ["Last message", last ? `${relativeDay(last.created_at)} at ${clockTime(last.created_at)}` : "—"]]),
    theme, activity);
}

/* --- wiring --- */
function initMedia() {
  const armPicker = () => { pickerOpen = true; setTimeout(() => { pickerOpen = false; }, 120000); };
  const disarm = () => setTimeout(() => { pickerOpen = false; }, 900);
  const bind = (inputId, buttonId, handler) => {
    const input = byId(inputId);
    byId(buttonId)?.addEventListener("click", () => { armPicker(); input.click(); });
    input.addEventListener("change", () => { const files = [...input.files]; input.value = ""; disarm(); if (files.length) handler(files); });
    input.addEventListener("cancel", disarm);
  };
  bind("file-chat", "attach-btn", sendFiles);
  bind("file-gallery", "gallery-add", uploadToGallery);
  byId("file-bg").addEventListener("change", (e) => { const file = e.target.files[0]; e.target.value = ""; disarm(); if (file) chooseBackground(file); });
  window.addEventListener("focus", disarm);

  byId("gallery-close").addEventListener("click", closeGallery);
  byId("viewer-close").addEventListener("click", closeViewer);
  byId("viewer-del").addEventListener("click", () => viewerCtx?.onDelete?.());
  byId("gallery-body").addEventListener("click", (event) => {
    const tileEl = event.target.closest(".tile[data-gid]");
    const item = tileEl && gallery.items.find((i) => i.id === tileEl.dataset.gid);
    if (item) openViewer(item, { onDelete: () => deleteGalleryItem(item) });
  });
  byId("info-body").addEventListener("click", async (event) => {
    const el = event.target.closest("[data-i]");
    if (!el) return;
    try {
      if (el.dataset.i === "bg") { armPicker(); byId("file-bg").click(); }
      else if (el.dataset.i === "theme") await setTheme(el.dataset.theme, null);
      else if (el.dataset.i === "bg-adjust") { const cur = bgParts(activeChat.themeBg); await backgroundDialog({ existing: { url: cur.url, pid: cur.pid }, dim: cur.dim, blur: cur.blur }); }
      else if (el.dataset.i === "bg-reset") await setTheme(activeChat.theme || "ocean", null);
    } catch (e) { toast(e.message || "That didn't work"); }
  });
  byId("msg-list").addEventListener("click", (event) => {
    if (event.target.closest(".upl") || Date.now() - sheetOpenedAt < 700) return;
    const wrap = event.target.closest(".media");
    const m = wrap && chat.msgs.get(wrap.closest(".msg").dataset.cid);
    if (m?.media?.url && safeUrl(m.media.url) && !uploads.has(m.client_id)) openViewer({ url: m.media.url, kind: m.kind });
  });
  document.addEventListener("click", (event) => {      // cancel / retry buttons on every upload overlay
    const upl = event.target.closest(".upl");
    if (!upl) return;
    if (event.target.closest(".x")) cancelJob(upl.dataset.job);
    else if (event.target.closest(".retry")) retryJob(upl.dataset.job);
  });
  window.addEventListener("online", () => { pump(); });
  window.addEventListener("offline", () => { uploads.forEach((job) => paint(job)); });
}

/* --- PWA --- */
async function warmLibs() {           // best effort: pull the Supabase client into the offline cache once the service worker is active
  if (!navigator.onLine || !isConfigured()) return;
  const seen = new Set();
  const crawl = async (url, depth) => {
    if (seen.has(url) || depth > 3 || seen.size > 80) return;
    seen.add(url);
    try {
      const text = await (await fetch(url)).text();
      if (depth < 3) for (const match of text.matchAll(/(?:from|import)\s*["'](\/[^"']+)["']/g)) await crawl(new URL(match[1], url).href, depth + 1);
    } catch { /* ignore */ }
  };
  await crawl("https://esm.sh/@supabase/supabase-js@2.45.4", 0);
}
function registerPwa() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").then(() => navigator.serviceWorker.ready).then(warmLibs).catch(() => {});
  });
}

/* ===== PUSH NOTIFICATIONS (only runs inside the Android app; does nothing in a normal browser) ===== */
const Push = (() => {
  const cap = window.Capacitor;
  const plugin = cap && cap.isNativePlatform && cap.isNativePlatform() ? ((cap.Plugins && cap.Plugins.PushNotifications) || (cap.registerPlugin && cap.registerPlugin("PushNotifications"))) : null;
  const TOKEN_KEY = "pc.pushToken";
  let token = null, wired = false, asked = false;
  try { token = localStorage.getItem(TOKEN_KEY); } catch { /* ignore */ }

  /** Tells the server "send my notifications to this phone". Only runs when already signed in (never creates a user). */
  async function syncToken() {
    if (!token) return;
    try {
      const sb = await getClient();
      const { data } = await sb.auth.getSession();
      if (!data.session) return;
      await sb.rpc("register_device", { p_token: token });
    } catch { /* retried next time a chat opens */ }
  }

  /** Notification tapped: open that conversation (only if this phone already knows it, so the secret code is never bypassed for a new chat). */
  async function openFromPush(chatId) {
    if (!chatId) return;
    const record = (await idb.all("meta")).find((r) => r.key === "access:" + chatId);
    if (!record) return;
    if (screens.current === "chat" && activeChat && activeChat.id === chatId) return;
    if (screens.current !== "calculator") screens.show("calculator");
    openRemembered(record);
  }

  function init() {
    if (!plugin || wired) return;
    wired = true;
    plugin.addListener("registration", (t) => {
      token = t.value;
      try { localStorage.setItem(TOKEN_KEY, token); } catch { /* ignore */ }
      syncToken();
    });
    plugin.addListener("registrationError", (e) => console.warn("push registration failed", e));
    plugin.addListener("pushNotificationActionPerformed", (action) => {
      const data = (action && action.notification && action.notification.data) || {};
      openFromPush(data.chat_id);
    });
    try { plugin.createChannel({ id: "messages", name: "Messages", description: "New message alerts", importance: 4, visibility: 0, vibration: true }); } catch { /* old Android */ }
  }

  /** Called every time a chat opens: asks permission once, registers, refreshes the token on the server. */
  async function start() {
    if (!plugin) return;
    init();
    try { plugin.removeAllDeliveredNotifications(); } catch { /* ignore */ }
    if (asked) { syncToken(); return; }
    asked = true;
    try {
      pickerOpen = true;   // the permission pop-up backgrounds the page: do not bounce to the calculator meanwhile
      let perm = await plugin.checkPermissions();
      if (perm.receive !== "granted") perm = await plugin.requestPermissions();
      setTimeout(() => { pickerOpen = false; }, 900);
      if (perm.receive === "granted") await plugin.register();
      else asked = false;     // ask again next time
    } catch { pickerOpen = false; asked = false; }
    syncToken();
  }
  return { init, start };
})();

/* ===== H. BOOT ===== */
window.App = { screens };
initScreens();
initCalculator();
initBackendUi();
registerPwa();
Push.init();

/* ===== keyboard-aware layout ===== */
(function keyboardFit() {
  const vv = window.visualViewport, app = document.getElementById("app");
  if (!vv || !app) return;
  let last = vv.height;
  const fit = () => {
    const open = window.innerHeight - vv.height > 120;
    app.classList.toggle("kb", open);
    app.style.height = vv.height + "px"; app.style.bottom = "auto"; app.style.top = vv.offsetTop + "px";
    const list = document.getElementById("msg-list");
    if (list && vv.height < last) list.scrollTop = list.scrollHeight;     // keyboard opened: keep the latest message in view
    last = vv.height;
  };
  vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
})();

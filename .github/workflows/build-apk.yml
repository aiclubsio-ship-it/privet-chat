name: Build Android APK

on:
  workflow_dispatch:      # lets you press a "Run workflow" button from your phone
  push:
    branches: [main]

permissions:
  contents: write         # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Firebase file was provided
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("google-services.json"))
          names = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
          print("Firebase package names:", names)
          if "com.privatecalc.app" not in names:
              sys.exit("::error::google-services.json was made for " + str(names) + " but the app id must be com.privatecalc.app. Re-create the Android app in Firebase with exactly that package name.")
          PY

      - name: Prepare website files
        run: |
          mkdir www
          cp index.html manifest.json service-worker.js www/
          ls -la www

      - name: Install Capacitor (turns the website into an Android app)
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/push-notifications@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.privatecalc.app",
            "appName": "Calculator",
            "webDir": "www",
            "backgroundColor": "#000000",
            "android": { "backgroundColor": "#000000" }
          }
          JSON
          npx cap add android

      - name: Add Firebase, notification settings and icons
        run: |
          cp google-services.json android/app/google-services.json
          pip install pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw

          # ---- AndroidManifest: notification permission + default notification icon/channel ----
          mp = "android/app/src/main/AndroidManifest.xml"
          m = open(mp, encoding="utf-8").read()
          if "POST_NOTIFICATIONS" not in m:
              m = m.replace("</manifest>", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>')
          m = m.replace("</application>",
              '    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n'
              '    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="messages" />\n'
              '</application>')
          open(mp, "w", encoding="utf-8").write(m)

          # ---- calculator-looking icons ----
          def glyph(size, pad):
              """Draws a little calculator on a transparent square canvas."""
              S = size * 4
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              box = S * (1 - 2 * pad)
              x0 = y0 = S * pad
              d.rounded_rectangle([x0, y0, x0 + box, y0 + box], radius=box * 0.16, fill=(28, 28, 30, 255))
              d.rounded_rectangle([x0 + box * .08, y0 + box * .08, x0 + box * .92, y0 + box * .30], radius=box * .05, fill=(60, 60, 64, 255))
              cell = box * .84 / 4
              for r in range(4):
                  for c in range(4):
                      cx = x0 + box * .08 + cell * (c + .5)
                      cy = y0 + box * .39 + cell * .66 * (r + .5)
                      color = (255, 159, 10, 255) if c == 3 else ((165, 165, 168, 255) if r == 0 and c < 3 else (80, 80, 84, 255))
                      rad = cell * .30
                      d.ellipse([cx - rad, cy - rad, cx + rad, cy + rad], fill=color)
              return im.resize((size, size), Image.LANCZOS)

          def legacy(size, round_=False):
              base = Image.new("RGBA", (size, size), (0, 0, 0, 255))
              base.alpha_composite(glyph(size, 0.12))
              if round_:
                  mask = Image.new("L", (size * 4, size * 4), 0)
                  ImageDraw.Draw(mask).ellipse([0, 0, size * 4 - 1, size * 4 - 1], fill=255)
                  base.putalpha(mask.resize((size, size), Image.LANCZOS))
              return base

          def stat(size):
              S = size * 4
              im = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              p = S * .14
              d.rounded_rectangle([p, p, S - p, S - p], radius=S * .12, fill=(255, 255, 255, 255))
              d.rounded_rectangle([S * .27, S * .24, S * .73, S * .38], radius=S * .03, fill=(0, 0, 0, 0))
              for r in range(3):
                  for c in range(3):
                      cx, cy, rad = S * (.33 + .17 * c), S * (.52 + .14 * r), S * .045
                      d.ellipse([cx - rad, cy - rad, cx + rad, cy + rad], fill=(0, 0, 0, 0))
              return im.resize((size, size), Image.LANCZOS)

          res = "android/app/src/main/res"
          for dpi, legacy_px, fg_px, stat_px in [("mdpi", 48, 108, 24), ("hdpi", 72, 162, 36), ("xhdpi", 96, 216, 48), ("xxhdpi", 144, 324, 72), ("xxxhdpi", 192, 432, 96)]:
              os.makedirs(f"{res}/mipmap-{dpi}", exist_ok=True)
              os.makedirs(f"{res}/drawable-{dpi}", exist_ok=True)
              legacy(legacy_px).save(f"{res}/mipmap-{dpi}/ic_launcher.png")
              legacy(legacy_px, True).save(f"{res}/mipmap-{dpi}/ic_launcher_round.png")
              glyph(fg_px, 0.20).save(f"{res}/mipmap-{dpi}/ic_launcher_foreground.png")
              stat(stat_px).save(f"{res}/drawable-{dpi}/ic_stat_notify.png")

          bg = f"{res}/values/ic_launcher_background.xml"
          if os.path.exists(bg):
              open(bg, "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')

          # website icons used by the manifest / service worker
          glyph(192, 0.06).save("www/icon-192.png")
          glyph(512, 0.06).save("www/icon-512.png")
          glyph(180, 0.06).save("www/apple-touch-icon.png")

          # black start-up screen instead of the Capacitor logo
          for f in glob.glob(f"{res}/drawable*/splash.png"):
              w, h = Image.open(f).size
              Image.new("RGB", (w, h), (0, 0, 0)).save(f)
          PY

      - name: Hide app preview in recent-apps screen
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          cat > "$F" <<'JAVA'
          package com.privatecalc.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 33) {
                setRecentsScreenshotEnabled(false);
              }
            }

            @Override
            protected void onPause() {
              // leaving the app (home / recent apps): hide the content from the preview
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              super.onPause();
            }

            @Override
            public void onResume() {
              super.onResume();
              // back in the app: allow screenshots again
              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
            }
          }
          JAVA
          cat "$F"

      - name: Signing key (keeps future updates installable over the old app)
        run: |
          mkdir -p ~/.android signing
          if [ ! -f signing/debug.keystore ]; then
            keytool -genkeypair -keystore signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add signing/debug.keystore
            git commit -m "Add app signing key"
            git push
          fi
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk calculator.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Calculator APK ${{ github.run_number }}
          files: calculator.apk
